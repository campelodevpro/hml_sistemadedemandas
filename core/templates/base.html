{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sismon{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light app-nav">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="{% url 'board' %}">Sismon</a>
      {% if user.is_authenticated %}<div class="d-flex align-items-center gap-3"><span class="text-muted small">{{ user.get_full_name|default:user.email }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Sair</button></form></div>{% endif %}
    </div>
  </nav>
  <main class="container-fluid px-4 py-4">
    {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
